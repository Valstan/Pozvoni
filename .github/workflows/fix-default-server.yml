name: fix-default-server

# Чужой Host рвётся 444 нашим regex-catch-all'ом, не отбирая default_server
# (письмо brain 2026-10-19 предлагало вариант А — ждать, пока сосед снимет
# свой; ждать не нужно). nginx проверяет регулярные `server_name` раньше
# перехода к default-серверу, поэтому блок `server_name ~^; return 444;` в
# НАШЕЙ секции ловит любой Host, не совпавший с точными именами, и чужой
# конфиг при этом не меняется. `default_server` остаётся у соседа, дубля нет,
# `nginx -t` остаётся зелёным.
#
# Два режима:
#   check — только чтение: кто держит default_server (счётчики, без имён и
#           путей), что отвечает чужой Host, наши имена и явные имена соседа;
#           вердикт: READY_TO_APPLY | DONE | BLOCKED_NEIGHBOUR | HUMAN | BROKEN.
#   apply — идемпотентная правка: если сайт соседа живёт на catch-all без
#           явного имени — НИЧЕГО не трогает (код 3); если include в чужом
#           файле — отдаёт человеку; иначе вставляет наш блок с бэкапом,
#           `nginx -t` до reload, проверяет на живом конфиге (чужой Host
#           закрыт, наши имена 200, явные имена соседа не просели) и
#           откатывается при неуспехе.
#
# Все адреса, порты и пути приходят СЕКРЕТАМИ, не через vars: значения vars
# печатаются в лог прогона, а логи публичного репозитория публичны (AGENTS.md,
# D-038). Здесь нет ни одного echo с фактами о сервере.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — только посмотреть; apply — поставить наш catch-all 444 (regex)"
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read

# Все run-шаги — под `bash -eo pipefail` (письмо brain 2026-09-05, [G322]).
defaults:
  run:
    shell: bash

concurrency:
  group: fix-default-server
  cancel-in-progress: false

jobs:
  fix-default-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Ключ доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: default_server и catch-all 444
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          MODE: ${{ inputs.mode }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        # Скрипт уходит файлом на stdin, а не сочиняется здесь строкой (мандат D-046).
        # SMOKE_URL — тот же секрет, что у смоука: список публичных доменов не должен
        # жить в двух местах; разбивает его удалённый шелл (G30).
        #
        # stderr клиента ssh заглушён намеренно: при отказе он печатает хост и порт
        # отдельными словами, а маскировка GitHub ловит только полное значение секрета
        # (AGENTS.md, D-038). Вся диагностика скрипта идёт в stdout.
        run: |
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$MODE" "$SMOKE_URL" \
            < deploy/remote-fix-default-server.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"
