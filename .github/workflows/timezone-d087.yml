name: timezone-d087

# Таймзона PostgreSQL — окно D-087 (мандат brain 2026-10-07).
# Только ручной запуск: ALTER SYSTEM + reload, без рестарта кластера.
# Ребут бокса в этом окне — через панель хостера (бокс — openvz):
# этот прогон ребута не делает и идёт что до, что после него.
#
# Все адреса, порты и пути приходят СЕКРЕТАМИ, не через vars: значения vars
# печатаются в лог прогона, а логи публичного репозитория публичны (AGENTS.md,
# D-038). Здесь нет ни одного echo с фактами о сервере.

on:
  workflow_dispatch:

permissions:
  contents: read

# Все run-шаги — под `bash -eo pipefail` (письмо brain 2026-09-05, [G322]).
defaults:
  run:
    shell: bash

concurrency:
  group: timezone-d087
  cancel-in-progress: false

jobs:
  timezone-d087:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Ключ доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: Таймзона PostgreSQL (ALTER SYSTEM + reload)
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        # Скрипт уходит файлом на stdin, а не сочиняется здесь строкой:
        # текст внутри команды прошёл бы четыре парсера подряд (мандат D-046).
        run: |
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s < deploy/remote-timezone-d087.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"

      - name: Приёмка (SHOW timezone, домены, failed)
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        run: |
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$APP_PORT" "$SMOKE_URL" < deploy/remote-acceptance-d087.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"
